<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Croque-Route">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Croque-Route</title>
<style>
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--ink:#0A0A0A;--muted:#767676;--line:rgba(10,10,10,.10);
  --sign:#0A0A0A;--sign-line:rgba(255,255,255,.14);--glass:rgba(250,250,248,.82);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0A0A;--surface:#141414;--ink:#F5F5F3;--muted:#8C8C8C;--line:rgba(255,255,255,.12);
  --sign:#1C1C1C;--sign-line:rgba(255,255,255,.12);--glass:rgba(10,10,10,.82);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 22px calc(110px + env(safe-area-inset-bottom))}

/* Logos : cercle monochrome */
.lg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ink);color:var(--bg);font:400 15px/1 var(--serif);letter-spacing:.2px}
.lg svg{width:18px;height:18px;fill:currentColor}
.lg.im{background:#fff;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(10,10,10,.12)}
.lg.im img{width:100%;height:100%;display:block}
.lg.mono{background:var(--ink);color:var(--bg)}

/* Accueil */
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.1px;font-size:15px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.logo svg path{stroke:var(--bg)}
h1{font:400 50px/.98 var(--serif);letter-spacing:-.8px;margin:34px 0 12px}
.sub{color:var(--muted);margin:0 0 24px;font-size:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 16px}
.route{display:flex;align-items:stretch;gap:12px}
.rail-ic{display:flex;flex-direction:column;align-items:center;padding:21px 0}
.rail-ic i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink)}
.rail-ic u{flex:1;width:0;border-left:1.5px dotted var(--muted);margin:5px 0}
.rail-ic b{width:9px;height:9px;border-radius:2px;background:var(--ink)}
.fields{flex:1;min-width:0}
.fields input{width:100%;height:54px;border:0;outline:0;background:transparent;font-size:17px;font-weight:500}
.fields input::placeholder{color:var(--muted);font-weight:400}
.fields hr{border:0;border-top:1px solid var(--line);margin:0}
.sug{position:absolute;left:-1px;right:-1px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.14);overflow:hidden;display:none}
.sug.show{display:block}
#sugFrom{top:62px}#sugTo{top:117px}
.sug button{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--bg)}
.sug .s1{font-weight:600;font-size:15px}
.sug .s2{color:var(--muted);font-size:13px}
.swap{align-self:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-right:6px}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:32px 0 12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;font-weight:500;transition:transform .15s,background .2s,color .2s}
.chip .lg{width:26px;height:26px;font-size:12px}
.chip .lg svg{width:14px;height:14px}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on .lg.mono{background:var(--bg);color:var(--ink)}
.cta{width:100%;height:56px;margin-top:16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;letter-spacing:.2px;transition:transform .15s}
.cta:active{transform:scale(.985)}
.err{color:#B42318;margin:14px 2px 0;font-size:14px}

/* Barre d'onglets */
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;z-index:10;display:flex;padding:8px 24px calc(10px + env(safe-area-inset-bottom));background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab.on{color:var(--ink)}

/* Résultats */
#results{z-index:20;background:var(--bg);transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#results.show{transform:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.top .t{font-weight:600;font-size:17px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .s{color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:var(--bg)}
.dists{display:flex;gap:8px;margin:12px 0 4px}
.dists button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;background:transparent;color:var(--muted);border:1px solid var(--line)}
.dists button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:13.5px;margin:16px 2px 12px}
.tl{position:relative}
.node{display:flex;gap:14px}
.lane{display:flex;flex-direction:column;align-items:center;width:14px;flex:none}
.lane .dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);margin-top:20px;flex:none}
.lane .line{flex:1;width:1.5px;background:var(--ink);opacity:.22}
.node.end .lane .line{display:none}
.endpt{display:flex;align-items:center;gap:14px;padding:6px 0 12px}
.endpt .lane .dot{margin:0;border-color:var(--ink)}
.endpt .lane .dot.sq{border-radius:3px;background:var(--ink)}
.endpt span{font-weight:600}
.endpt small{color:var(--muted);margin-left:6px;font-weight:400}
.sign{flex:1;min-width:0;margin-bottom:12px;background:var(--sign);color:#fff;border-radius:22px;padding:16px 18px 4px;border:1px solid var(--sign-line)}
.sign-in{border:0;padding:0}
.sign-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.sign-h b{font:400 30px/1 var(--serif);letter-spacing:-.3px}
.sign-h span{font-size:13px;color:rgba(255,255,255,.6)}
.sign .lg.mono{background:#fff;color:#0A0A0A}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border-radius:0;padding:12px 0;margin:0;border-top:1px solid var(--sign-line);transition:opacity .15s}
.it:active{opacity:.6}
.it .nm{flex:1;min-width:0;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ds{font-size:13px;color:rgba(255,255,255,.62);white-space:nowrap}
.it .axe{background:#fff;color:#0A0A0A;font-size:10px;font-weight:700;letter-spacing:.9px;padding:4px 9px;border-radius:999px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;color:var(--muted)}
.load{text-align:center;padding:60px 20px;color:var(--muted)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin:18px auto 0;max-width:220px}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.skel{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--surface),var(--line),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}

/* Récents */
.rec{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.rec .r1{font-weight:600}
.rec .r2{color:var(--muted);font-size:13px}

/* Fiche détail */
.ov{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.show{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 18px}
.sh-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sh-h .lg{width:52px;height:52px;font-size:20px}
.sh-h .lg svg{width:26px;height:26px}
.sh-h .n{font:400 26px/1.1 var(--serif);letter-spacing:-.2px}
.sh-h .k{color:var(--muted);font-size:14px;margin-top:2px}
.info{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.info .l{width:84px;color:var(--muted);flex:none}
.go3{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.go3 a{display:flex;align-items:center;justify-content:center;height:52px;border-radius:15px;font-weight:600;text-decoration:none;background:transparent;color:var(--ink);border:1px solid var(--line)}
.go3 a.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hide{display:none!important}
/* Choix de l'itinéraire */
.map{position:relative;z-index:0;isolation:isolate;height:330px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px}
.map.fb{padding:14px;height:auto}
.map.fb svg{display:block;width:100%;height:190px}
.map .leaflet-container{width:100%;height:100%;background:var(--surface);font:inherit}
.map .leaflet-control-attribution{font-size:9.5px;background:var(--glass);color:var(--muted)}
.map .leaflet-tile-pane{filter:grayscale(1) contrast(.9) brightness(1.06)}
@media (prefers-color-scheme:dark){.map .leaflet-tile-pane{filter:grayscale(1) invert(1) contrast(.85) brightness(.9)}}
.rlab span{display:inline-block;transform:translate(-50%,-50%);background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:4px 10px;font:700 12.5px/1 "Inter",system-ui,sans-serif;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rlab.on span{background:var(--ink);color:var(--bg)}
.pin-a,.pin-b{border-radius:50%;box-sizing:border-box}
.pin-a{background:var(--surface);border:3px solid var(--ink)}
.pin-b{background:var(--ink);border-radius:4px;border:2px solid var(--surface)}
.r-kinds{display:flex;gap:6px;margin-top:8px}
.r-kinds span{font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.rt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:10px;transition:border-color .15s,background .15s}
.rt.on{border-color:var(--ink);box-shadow:inset 0 0 0 .5px var(--ink)}
.rt .r-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rt .r-dur{font:400 30px/1 var(--serif)}
.rt .r-tag{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap}
.rt .r-tag.soft{background:transparent;color:var(--muted);border:1px solid var(--line)}
.rt .r-via{margin-top:8px;font-weight:600;font-size:15px}
.rt .r-sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.cta.fix{margin-top:6px}
</style>
</head>
<body>
<div id="app">

  <!-- ACCUEIL -->
  <section class="view" id="home">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 3 4 21M15 3l5 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M12 6v3M12 12v3M12 18v3" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      <span>Croque-Route</span>
    </div>
    <h1>Où manger<br>sur ta route ?</h1>
    <p class="sub">Tous les arrêts de ton trajet, enseigne par enseigne.</p>

    <div class="card route">
      <div class="rail-ic"><i></i><u></u><b></b></div>
      <div class="fields">
        <input id="from" type="text" placeholder="Départ" autocomplete="off" autocapitalize="words" enterkeyhint="next">
        <hr>
        <input id="to" type="text" placeholder="Arrivée" autocomplete="off" autocapitalize="words" enterkeyhint="go">
      </div>
      <div class="sug" id="sugFrom"></div><div class="sug" id="sugTo"></div>
      <button class="swap" id="swap" aria-label="Inverser"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg></button>
    </div>
    <button class="cta" id="go">Trouver mes arrêts</button>
    <div class="err" id="homeErr"></div>

    <h2>Filtrer par enseigne (facultatif)</h2>
    <div class="chips" id="chips"></div>
    <p class="sub" style="margin-top:14px;font-size:13px">Aucune sélection : tous les fast-foods et restaurants de la base.</p>
    <p class="sub" id="dbInfo" style="font-size:12px;margin-top:-6px"></p>
  </section>

  <!-- RÉCENTS -->
  <section class="view hide" id="recents">
    <div class="brand"><span style="font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px">Récents</span></div>
    <h1 style="margin-top:14px">Tes derniers<br>trajets</h1>
    <div id="recList"></div>
  </section>

  <nav class="tabs">
    <button class="tab on" data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Trajet</button>
    <button class="tab" data-tab="recents"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Récents</button>
  </nav>

  <!-- RÉSULTATS -->
  <section class="view" id="results">
    <div class="top">
      <button class="back" id="back" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="min-width:0"><div class="t" id="rTitle">Trajet</div><div class="s" id="rSub"></div></div>
    </div>
    <div id="rBody"></div>
  </section>

  <!-- FICHE -->
  <div class="ov" id="ov"></div>
  <div class="sheet" id="sheet"></div>
</div>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Stockage ---------- */
function loadRecents(){try{return JSON.parse(localStorage.getItem('cr_recents')||'[]')}catch(e){return[]}}
function saveRecent(from,to,brands,fp,tp){
  try{
    let r=loadRecents().filter(x=>!(x.from===from&&x.to===to));
    r.unshift({from,to,brands,fp,tp,ts:Date.now()});
    localStorage.setItem('cr_recents',JSON.stringify(r.slice(0,8)));
  }catch(e){}

/* ---------- Badges ---------- */
function brandOf(tags){
  for(const b of BRANDS){
    const re=new RegExp(b.rx,'i');
    if((tags.brand&&re.test(tags.brand))||(tags.name&&re.test(tags.name)))return b;
  }
  return null;
}
function logo(b,tags){
  if(b&&b.slug&&ICONS[b.slug])return `<span class="lg" style="background:${b.bg};color:${b.fg}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[b.slug]}"/></svg></span>`;
  if(b&&b.img)return `<span class="lg im"><img src="logos/${b.img}.png" alt="" loading="lazy"></span>`;
  const t=b?b.ab:(tags.name||tags.brand||'?').trim().charAt(0).toUpperCase();
  return `<span class="lg mono">${esc(t)}</span>`;
}

/* ---------- Suggestions d'adresses (API Adresse, base officielle française) ---------- */
function toPlace(f){
  const p=f.properties;
  return {
    lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],
    name:p.type==='municipality'?p.name:p.label,
    label:p.type==='municipality'?`${p.name} (${(p.context||'').split(',')[0].trim()})`:p.label,
    sub:p.context||''
  };
}
async function adresse(q,limit){
  const r=await fetch('https://api-adresse.data.gouv.fr/search/?limit='+limit+'&autocomplete=1&q='+encodeURIComponent(q));
  const j=await r.json();
  return (j.features||[]).map(toPlace);
}
function hideSug(){$('sugFrom').classList.remove('show');$('sugTo').classList.remove('show')}
function attachSuggest(key,inputId,sugId){
  const inp=$(inputId),box=$(sugId);let timer=null,seq=0,items=[];
  inp.addEventListener('input',()=>{
    picked[key]=null;clearTimeout(timer);
    const q=inp.value.trim();
    if(q.length<3){box.classList.remove('show');return}
    timer=setTimeout(async()=>{
      const my=++seq;
      try{
        items=await adresse(q,5);
        if(my!==seq)return;
        box.innerHTML=items.map((p,i)=>`<button data-i="${i}"><div class="s1">${esc(p.name)}</div><div class="s2">${esc(p.sub)}</div></button>`).join('');
        box.classList.toggle('show',items.length>0);
      }catch(e){box.classList.remove('show')}
    },220);
  });
  box.addEventListener('pointerdown',e=>{
    const b=e.target.closest('button');if(!b)return;
    e.preventDefault();
    const p=items[+b.dataset.i];
    picked[key]=p;inp.value=p.label;box.classList.remove('show');
    if(key==='from')$('to').focus();else inp.blur();
  });
  inp.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('show'),150));
}
attachSuggest('from','from','sugFrom');
attachSuggest('to','to','sugTo');
$('from').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('to').focus()}});

/* ---------- Données ---------- */
async function geocode(q,key){
  if(picked[key])return picked[key];
  try{const a=await adresse(q,1);if(a.length)return a[0]}catch(e){}
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q='+encodeURIComponent(q));
  const j=await r.json();
  if(!j.length)throw new Error('Lieu introuvable : '+q);
  return {lat:+j[0].lat,lon:+j[0].lon,name:j[0].display_name.split(',')[0]};
}
async function getRoute(a,b){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`);
  const j=await r.json();
  if(!j.routes||!j.routes[0])throw new Error('Itinéraire introuvable');
  return j.routes[0];
}
function hav(a,b){
  const R=6371000,t=Math.PI/180,dLat=(b[1]-a[1])*t,dLon=(b[0]-a[0])*t;
  const x=Math.sin(dLat/2)**2+Math.cos(a[1]*t)*Math.cos(b[1]*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
let C=[],CUM=[];
const CELL=0.02;let GRID=new Map();
function prepare(g){
  C=g;CUM=[0];
  for(let i=1;i<C.length;i++)CUM.push(CUM[i-1]+hav(C[i-1],C[i]));
  GRID=new Map();
  for(let i=0;i<C.length-1;i++){
    const a=C[i],b=C[i+1];
    const n=Math.max(1,Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))/(CELL/2)));
    let last='';
    for(let k=0;k<=n;k++){
      const x=a[0]+(b[0]-a[0])*k/n,y=a[1]+(b[1]-a[1])*k/n;
      const key=Math.floor(x/CELL)+','+Math.floor(y/CELL);
      if(key===last)continue;last=key;
      let l=GRID.get(key);if(!l){l=[];GRID.set(key,l)}
      if(l[l.length-1]!==i)l.push(i);
    }
  }
}
function sample(step){
  const p=[C[0]];let n=step;
  for(let i=1;i<C.length;i++){if(CUM[i]>=n){p.push(C[i]);n+=step}}
  p.push(C[C.length-1]);return p;
}
async function overpass(q,start){
  for(let k=0;k<EPS.length*2;k++){
    const ep=EPS[(start+k)%EPS.length];
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),30000);
    try{
      const r=await fetch(ep,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)});
      clearTimeout(timer);
      if(!r.ok)continue;
      return await r.json();
    }catch(e){clearTimeout(timer)}
  }
  return null;
}
function buildQuery(pts,rx){
  const line=pts.map(p=>p[1].toFixed(5)+','+p[0].toFixed(5)).join(',');
  const base='["amenity"~"^(fast_food|restaurant|cafe)$"]';
  const ar=`(around:${FETCH_RADIUS},${line})`;
  const body=rx?`nwr${base}["brand"~"${rx}",i]${ar};nwr${base}["name"~"${rx}",i]${ar};`:`nwr${base}["name"]${ar};`;
  return `[out:json][timeout:25];(${body});out center tags;`;
}
function locate(lat,lon){
  const kx=111320*Math.cos(lat*Math.PI/180),ky=110540;
  const cx=Math.floor(lon/CELL),cy=Math.floor(lat/CELL);
  let best=1e12,pos=0;
  for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
    const l=GRID.get((cx+ox)+','+(cy+oy));if(!l)continue;
    for(const i of l){
      const ax=(C[i][0]-lon)*kx,ay=(C[i][1]-lat)*ky;
      const bx=(C[i+1][0]-lon)*kx,by=(C[i+1][1]-lat)*ky;
      const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
      let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(ax+t*dx,ay+t*dy);
      if(d<best){best=d;pos=CUM[i]+t*(CUM[i+1]-CUM[i])}
    }
  }
  return {dist:best,pos};
}

/* ---------- Base locale (pois.json, construite une fois par build_pois.py) ---------- */
let POIS=null;
async function loadPois(){
  try{
    const r=await fetch('pois.json');
    if(!r.ok)throw new Error('absent');
    POIS=await r.json();
    $('dbInfo').textContent=`Base chargée : ${POIS.p.length.toLocaleString('fr-FR')} lieux${POIS.date?' · mise à jour '+POIS.date:''}`;
  }catch(e){
    POIS=null;
    $('dbInfo').textContent='Base locale absente : la recherche passera par internet et sera lente.';
  }
}
function localSearch(){
  const sel=state.selected.size?new Set([...state.selected].map(l=>POIS.brands.indexOf(l)).filter(i=>i>=0)):null;
  const types=['fast_food','restaurant','cafe'];
  const out=[];
  for(let k=0;k<POIS.p.length;k++){
    const q=POIS.p[k];
    if(sel&&!sel.has(q[3]))continue;
    const l=locate(q[0],q[1]);
    if(l.dist>FETCH_RADIUS)continue;
    const tags={name:q[2],amenity:types[q[4]]};
    if(q[3]>=0)tags.brand=POIS.brands[q[3]];
    if(q[5])tags.aire=1;
    if(q[6])tags.opening_hours=q[6];
    if(q[7])tags.addr=q[7];
    out.push({id:'l'+k,lat:q[0],lon:q[1],tags,dist:l.dist,pos:l.pos});
  }
  out.sort((a,b)=>a.pos-b.pos);
  const res=[];
  for(const it of out){
    let dup=false;
    for(let j=res.length-1;j>=0&&it.pos-res[j].pos<400;j--){
      const o=res[j];
      if(o.tags.name.toLowerCase()===it.tags.name.toLowerCase()&&Math.abs(o.lat-it.lat)<0.0009&&Math.abs(o.lon-it.lon)<0.0013){
        dup=true;
        const score=x=>(x.tags.opening_hours?1:0)+(x.tags.addr?1:0);
        if(score(it)>score(o))res[j]=it;
        break;
      }
    }
    if(!dup)res.push(it);
  }
  return res;
}

/* ---------- Format ---------- */
function fmtDur(s){const m=Math.round(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')}
function fmtDist(m){return m>=1000?(m/1000).toFixed(1).replace('.',',')+' km':(Math.max(10,Math.round(m/10)*10))+' m'}
function fmtHours(h){
  const d={Mo:'Lun',Tu:'Mar',We:'Mer',Th:'Jeu',Fr:'Ven',Sa:'Sam',Su:'Dim',PH:'Fériés',off:'fermé'};
  return h.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH|off)\b/g,m=>d[m]);
}

/* ---------- Lancement ---------- */
function loadingHtml(msg){return `<div class="load"><div style="font-weight:600;color:var(--ink)" id="lt">${msg}</div><div class="bar"><i id="lb"></i></div></div><div class="skel"></div><div class="skel"></div>`}
async function fetchRoutes(a,b,extra){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson&steps=true&${extra}`);
  const j=await r.json();
  return j.routes||[];
}
function decode6(str){
  let i=0,lat=0,lon=0;const out=[];
  while(i<str.length){
    let b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);lon+=(r&1)?~(r>>1):(r>>1);
    out.push([lon/1e6,lat/1e6]);
  }
  return out;
}
async function fetchValhalla(a,b,noHighway){
  const body={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing:'auto',directions_options:{language:'fr-FR'}};
  if(noHighway)body.costing_options={auto:{use_highways:0}};else body.alternates=2;
  const r=await fetch('https://valhalla1.openstreetmap.de/route?json='+encodeURIComponent(JSON.stringify(body)));
  const j=await r.json();
  const trips=[j.trip,...(j.alternates||[]).map(x=>x.trip)].filter(Boolean);
  return trips.map(t=>{
    const coords=[],steps=[];
    for(const lg of t.legs){
      const pts=decode6(lg.shape);const off=coords.length?1:0;
      for(let k=off;k<pts.length;k++)coords.push(pts[k]);
      for(const m of lg.maneuvers||[]){
        const ref=(m.street_names||[]).find(n=>/^[ANDM]\s?\d+/i.test(n))||'';
        steps.push({ref,distance:(m.length||0)*1000});
      }
    }
    return {distance:t.summary.length*1000,duration:t.summary.time,geometry:{coordinates:coords},legs:[{steps}]};
  });
}
function similarRoute(r,o){
  const A=r.geometry.coordinates,B=o.geometry.coordinates;
  const sa=Math.max(1,Math.floor(A.length/40)),sb=Math.max(1,Math.floor(B.length/700));
  const bs=[];for(let i=0;i<B.length;i+=sb)bs.push(B[i]);
  let near=0,n=0;
  for(let i=0;i<A.length;i+=sa){
    n++;let best=1e12;
    for(const q of bs){
      const dx=(A[i][0]-q[0])*Math.cos(A[i][1]*Math.PI/180),dy=A[i][1]-q[1],d=dx*dx+dy*dy;
      if(d<best)best=d;
    }
    if(Math.sqrt(best)*111320<2000)near++;
  }
  return near/n>=0.92;
}
async function getRoutes(a,b){
  const res=await Promise.allSettled([
    fetchRoutes(a,b,'alternatives=3'),fetchRoutes(a,b,'exclude=motorway'),
    fetchValhalla(a,b,false),fetchValhalla(a,b,true)
  ]);
  const R=res.flatMap(x=>x.status==='fulfilled'?x.value:[]);
  if(!R.length)throw new Error('Itinéraire introuvable');
  const out=[];
  for(const r of R){if(!out.some(o=>similarRoute(r,o)))out.push(r)}
  return out.sort((x,y)=>x.duration-y.duration).slice(0,4);
}
function autoShare(rt){
  let a=0,t=0;
  for(const l of rt.legs||[])for(const st of l.steps||[]){t+=st.distance;if(/^A\s?\d/i.test((st.ref||'').split(';')[0].trim()))a+=st.distance}
  return t?a/t:0;
}
/* Axes principaux d'un itinéraire : les numéros de route (A40, N205…) cumulés sur au moins 8 % du trajet */
function mainRoads(rt){
  const acc=new Map();let order=0;
  for(const l of rt.legs||[])for(const st of l.steps||[]){
    let ref=(st.ref||'').split(';')[0].replace(/\s+/g,'').toUpperCase();
    if(!/^[ANDM]\d+/.test(ref))continue;
    const o=acc.get(ref)||{d:0,o:order++};o.d+=st.distance;acc.set(ref,o);
  }
  return [...acc.entries()].filter(([k,v])=>v.d>=Math.max(8000,rt.distance*0.08)).sort((a,b)=>a[1].o-b[1].o).map(([k])=>k.replace(/^([A-Z])(\d+)/,'$1$2')).slice(0,4);
}
function routePreview(routes,sel){
  const all=routes.flatMap(r=>r.geometry.coordinates);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of all){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  const k=Math.cos((y0+y1)/2*Math.PI/180),W=340,H=190,pad=14;
  const sx=(W-2*pad)/Math.max(1e-6,(x1-x0)*k),sy=(H-2*pad)/Math.max(1e-6,(y1-y0)),sc=Math.min(sx,sy);
  const ox=(W-(x1-x0)*k*sc)/2,oy=(H-(y1-y0)*sc)/2;
  const pt=p=>[(ox+(p[0]-x0)*k*sc).toFixed(1),(H-oy-(p[1]-y0)*sc).toFixed(1)];
  const path=r=>{const c=r.geometry.coordinates,st=Math.max(1,Math.floor(c.length/220));let d='';for(let i=0;i<c.length;i+=st){const q=pt(c[i]);d+=(d?'L':'M')+q[0]+' '+q[1]}const q=pt(c[c.length-1]);return d+'L'+q[0]+' '+q[1]};
  const order=routes.map((r,i)=>i).sort((a,b)=>(a===sel)-(b===sel));
  const a=pt(routes[0].geometry.coordinates[0]),z=pt(routes[0].geometry.coordinates.at(-1));
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${order.map(i=>`<path d="${path(routes[i])}" fill="none" stroke="${i===sel?'var(--ink)':'var(--muted)'}" stroke-opacity="${i===sel?1:.45}" stroke-width="${i===sel?3.2:2}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
  <circle cx="${a[0]}" cy="${a[1]}" r="5.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.4"/><rect x="${z[0]-5.5}" y="${z[1]-5.5}" width="11" height="11" rx="2.5" fill="var(--ink)"/></svg>`;
}
let MAP=null,MLINES=[],MLABS=[];
function buildMap(){
  const R=state.routes;
  if(MAP){MAP.remove();MAP=null}
  const dark=matchMedia('(prefers-color-scheme: dark)').matches;
  state.dark=dark;
  MAP=L.map('mapBox',{zoomControl:false,scrollWheelZoom:false,attributionControl:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
  const fr=[.5,.35,.65,.22];
  MLINES=[];MLABS=[];
  R.forEach((r,i)=>{
    const ll=r.geometry.coordinates.map(c=>[c[1],c[0]]);
    const line=L.polyline(ll,{weight:5,lineCap:'round',lineJoin:'round'}).addTo(MAP);
    line.on('click',()=>pickRoute(i));
    const mid=ll[Math.floor(ll.length*fr[i%4])];
    const lab=L.marker(mid,{icon:L.divIcon({className:'rlab',html:'<span>'+fmtDur(r.duration)+'</span>',iconSize:[0,0]})}).addTo(MAP);
    lab.on('click',()=>pickRoute(i));
    MLINES.push(line);MLABS.push(lab);
  });
  const c=R[0].geometry.coordinates;
  L.marker([c[0][1],c[0][0]],{icon:L.divIcon({className:'',html:'<div class="pin-a" style="width:16px;height:16px"></div>',iconSize:[16,16]}),interactive:false}).addTo(MAP);
  L.marker([c.at(-1)[1],c.at(-1)[0]],{icon:L.divIcon({className:'',html:'<div class="pin-b" style="width:16px;height:16px"></div>',iconSize:[16,16]}),interactive:false}).addTo(MAP);
  const all=R.flatMap(r=>r.geometry.coordinates.map(p=>[p[1],p[0]]));
  const fit=()=>{MAP.invalidateSize();MAP.fitBounds(L.latLngBounds(all),{padding:[34,34],animate:false})};
  fit();setTimeout(fit,450);
  styleRoutes();
}
function styleRoutes(){
  const dark=state.dark;
  MLINES.forEach((ln,i)=>{
    const on=i===state.sel;
    ln.setStyle({color:on?(dark?'#FFFFFF':'#0A0A0A'):'#8A8A8A',opacity:on?1:.8,weight:on?6:5});
    if(on)ln.bringToFront();
    MLABS[i].setZIndexOffset(on?1000:0);
    const el=MLABS[i].getElement();if(el)el.classList.toggle('on',on);
  });
}
function pickRoute(i){
  state.sel=i;
  document.querySelectorAll('.rt').forEach(x=>x.classList.toggle('on',+x.dataset.r===i));
  if(MAP)styleRoutes();
  else{const m=$('mapBox');if(m)m.innerHTML=routePreview(state.routes,i)}
}
function showChoice(){
  state.step='choice';
  const R=state.routes;
  const fast=Math.min(...R.map(r=>r.duration)),short=Math.min(...R.map(r=>r.distance));
  $('rTitle').textContent=`${state.fq} → ${state.tq}`;
  $('rSub').textContent=R.length>1?'Touche une ligne ou une carte pour choisir':'Un seul itinéraire trouvé';
  const hasL=!!window.L;
  let h=`<div class="map ${hasL?'':'fb'}" id="mapBox">${hasL?'':routePreview(R,state.sel)}</div>`;
  R.forEach((r,i)=>{
    const roads=mainRoads(r),sh=autoShare(r);
    const tag=r.duration===fast?'<span class="r-tag">Le plus rapide</span>':`<span class="r-tag soft">+ ${fmtDur(r.duration-fast)}</span>`;
    const kind=sh>=0.5?'Autoroute':sh<=0.1?'Sans autoroute':'Autoroute en partie';
    const extra=r.distance===short&&r.duration!==fast?'<span>Le plus court</span>':'';
    h+=`<button class="rt ${i===state.sel?'on':''}" data-r="${i}">
      <div class="r-top"><span class="r-dur">${fmtDur(r.duration)}</span>${tag}</div>
      <div class="r-via">${roads.length?'via '+roads.join(' · '):'Itinéraire '+(i+1)}</div>
      <div class="r-sub">${Math.round(r.distance/1000)} km</div>
      <div class="r-kinds"><span>${kind}</span>${extra}</div></button>`;
  });
  h+=`<button class="cta fix" id="goRoute">Voir les restos sur cet itinéraire</button>`;
  $('rBody').innerHTML=h;
  if(hasL)buildMap();
}
async function run(){
  const myRun=++runId;
  $('homeErr').textContent='';
  const fq=$('from').value.trim(),tq=$('to').value.trim();
  if(!fq||!tq){$('homeErr').textContent='Renseigne un départ et une arrivée.';return}
  state.fq=fq;state.tq=tq;state.step='loading';
  $('rTitle').textContent=`${fq} → ${tq}`;$('rSub').textContent='Calcul des itinéraires…';
  $('rBody').innerHTML=loadingHtml("Calcul des itinéraires…");
  $('results').classList.add('show');$('results').scrollTop=0;
  try{
    const [f,t]=await Promise.all([geocode(fq,'from'),geocode(tq,'to')]);
    state.from=f;state.to=t;
    const routes=await getRoutes(f,t);
    if(myRun!==runId)return;
    state.routes=routes;state.sel=0;
    showChoice();
  }catch(e){
    $('rSub').textContent='';
    $('rBody').innerHTML=`<div class="empty">${esc(e.message||'Erreur')}<br><br><button class="cta" style="height:48px" id="retry">Réessayer</button></div>`;
    $('retry').onclick=run;
  }
}
async function search(){
  const myRun=++runId,fq=state.fq,tq=state.tq,f=state.from,t=state.to;
  state.step='list';
  $('rSub').textContent='Recherche en cours…';
  $('rBody').innerHTML=loadingHtml("Recherche des arrêts…");
  $('results').scrollTop=0;
  try{
    state.route=state.routes[state.sel];
    prepare(state.route.geometry.coordinates);
    const labels=[...state.selected];
    if(POIS){
      state.found=localSearch();state.failed=0;
      saveRecent(fq,tq,labels,f,t);
      render();return;
    }
    const rx=labels.length?BRANDS.filter(b=>state.selected.has(b.label)).map(b=>b.rx).join('|'):null;
    const pts=sample(3000),CH=12,chunks=[];
    for(let i=0;i<pts.length-1;i+=CH-1)chunks.push(pts.slice(i,i+CH));
    const seen=new Map();let done=0,failed=0,next=0;
    $('lt').textContent=`Recherche des arrêts… 0/${chunks.length}`;
    const worker=async()=>{
      while(next<chunks.length){
        const i=next++;
        const j=await overpass(buildQuery(chunks[i],rx),i);
        if(myRun!==runId)return;
        done++;
        if(!j){failed++}else for(const e of j.elements){
          const id=e.type+e.id;if(seen.has(id))continue;
          const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;
          if(lat==null)continue;
          seen.set(id,{id,lat,lon,tags:e.tags||{}});
        }
        $('lt').textContent=`Recherche des arrêts… ${done}/${chunks.length}`;
        $('lb').style.width=Math.round(done/chunks.length*100)+'%';
      }
    };
    await Promise.all([worker(),worker()]);
    if(myRun!==runId)return;
    if(failed===chunks.length)throw new Error('Le serveur de données ne répond pas. Réessaie dans une minute.');
    state.failed=failed;
    state.found=[...seen.values()].map(p=>{const l=locate(p.lat,p.lon);return {...p,dist:l.dist,pos:l.pos}})
      .filter(p=>p.dist<=FETCH_RADIUS).sort((a,b)=>a.pos-b.pos);
    saveRecent(fq,tq,labels,f,t);
    render();
  }catch(e){
    $('rSub').textContent='';
    $('rBody').innerHTML=`<div class="empty">${esc(e.message||'Erreur')}<br><br><button class="cta" style="height:48px" id="retry">Réessayer</button></div>`;
    $('retry').onclick=search;
  }
}
loadPois();
$('go').onclick=run;
$('back').onclick=()=>{
  if(state.step==='list'&&state.routes&&state.routes.length){showChoice();return}
  runId++;$('results').classList.remove('show');
};

/* ---------- Résultats ---------- */
function groupItems(list){
  const g=[];let cur=null;
  for(const p of list){
    if(!cur||p.pos-cur.last>2500){cur={start:p.pos,last:p.pos,items:[]};g.push(cur)}
    cur.items.push(p);cur.last=p.pos;
  }
  g.forEach(x=>x.items.sort((a,b)=>a.dist-b.dist));
  return g;
}
function render(){
  const r=state.route;
  $('rSub').textContent=`${Math.round(r.distance/1000)} km · ${fmtDur(r.duration)}`;
  const list=state.found.filter(p=>p.dist<=state.maxDist&&(state.type==='all'||p.tags.amenity===state.type));
  state.groups=groupItems(list);
  const D=[[250,"Sur l'axe"],[500,'500 m'],[1000,'1 km']];
  const T=[['all','Tout'],['fast_food','Fast-food'],['restaurant','Restos'],['cafe','Cafés']];
  let h=`<div class="seg" id="seg">${T.map(([k,l])=>`<button data-t="${k}" class="${state.type===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="dists" id="dists">${D.map(([k,l])=>`<button data-d="${k}" class="${state.maxDist===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="count">${list.length} arrêt${list.length>1?'s':''} · ${state.groups.length} sortie${state.groups.length>1?'s':''}${state.failed?` · résultats partiels (${state.failed} tronçon${state.failed>1?'s':''} sans réponse)`:''}</div>`;
  h+=`<div class="tl"><div class="endpt"><div class="lane"><div class="dot"></div></div><span>${esc(state.from.name)}<small>km 0</small></span></div>`;
  if(!list.length){
    h+=`<div class="empty">Rien avec ces critères. Élargis l'écart à la route ou change d'enseigne.</div>`;
  }
  state.groups.forEach((g,gi)=>{
    const eta=fmtDur(g.start/r.distance*r.duration);
    h+=`<div class="node"><div class="lane"><div class="dot"></div><div class="line"></div></div>
    <div class="sign"><div class="sign-in">
      <div class="sign-h"><b>km ${Math.round(g.start/1000)}</b><span>dans ${eta}</span></div>
      ${g.items.map((p,ii)=>{
        const b=brandOf(p.tags),t=p.tags;
        const name=t.name||t.brand||'Sans nom';
        const axe=p.dist<250;
        return `<button class="it" data-g="${gi}" data-i="${ii}">${logo(b,t)}<span class="nm">${esc(name)}</span>${axe?'<span class="axe">SUR L\'AXE</span>':`<span class="ds">${fmtDist(p.dist)}</span>`}</button>`;
      }).join('')}
    </div></div></div>`;
  });
  h+=`<div class="endpt"><div class="lane"><div class="dot sq"></div></div><span>${esc(state.to.name)}<small>km ${Math.round(r.distance/1000)}</small></span></div></div>`;
  const keep=$('results').scrollTop;
  $('rBody').innerHTML=h;
  $('results').scrollTop=keep;
}
$('rBody').addEventListener('click',e=>{
  const rt=e.target.closest('[data-r]');
  if(rt){pickRoute(+rt.dataset.r);return}
  if(e.target.closest('#goRoute')){search();return}
  const t=e.target.closest('[data-t]');if(t){state.type=t.dataset.t;render();return}
  const d=e.target.closest('[data-d]');if(d){state.maxDist=+d.dataset.d;render();return}
  const it=e.target.closest('.it');if(it){openSheet(state.groups[+it.dataset.g].items[+it.dataset.i])}
});

/* ---------- Fiche ---------- */
function openSheet(p){
  const t=p.tags,b=brandOf(t);
  const name=t.name||t.brand||'Sans nom';
  const type={fast_food:'Fast-food',restaurant:'Restaurant',cafe:'Café'}[t.amenity]||'';
  const r=state.route,km=Math.round(p.pos/1000),eta=fmtDur(p.pos/r.distance*r.duration);
  const axe=p.dist<250,detour=Math.max(1,Math.round(2*p.dist/833));
  const addr=t.addr||[[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),t['addr:city']].filter(Boolean).join(', ');
  const f=state.from,to=state.to;
  const gm=`https://www.google.com/maps/dir/?api=1&origin=${f.lat},${f.lon}&destination=${to.lat},${to.lon}&waypoints=${p.lat},${p.lon}&travelmode=driving`;
  const wz=`https://waze.com/ul?ll=${p.lat},${p.lon}&navigate=yes`;
  const ap=`https://maps.apple.com/?daddr=${p.lat},${p.lon}&dirflg=d`;
  const bd=logo(b,t);
  $('sheet').innerHTML=`<div class="grab"></div>
  <div class="sh-h">${bd}<div style="min-width:0"><div class="n">${esc(name)}</div><div class="k">${esc(type)}${t.cuisine?' · '+esc(t.cuisine.split(';')[0].replace(/_/g,' ')):''}</div></div></div>
  <div class="info"><span class="l">Sur ta route</span><span>${axe?'Quasi aucun détour':`À ${fmtDist(p.dist)} de la route · détour estimé ~${detour} min`}</span></div>
  <div class="info"><span class="l">Position</span><span>Au km ${km}, dans ${eta}</span></div>
  ${t.aire?`<div class="info"><span class="l">Lieu</span><span>Aire d'autoroute ou de service</span></div>`:''}
  ${addr?`<div class="info"><span class="l">Adresse</span><span>${esc(addr)}</span></div>`:''}
  ${t.opening_hours?`<div class="info"><span class="l">Horaires</span><span>${esc(fmtHours(t.opening_hours))}</span></div>`:''}
  <div class="go3"><a class="p" href="${gm}" target="_blank" rel="noopener">Ajouter l'arrêt dans Google Maps</a><a href="${wz}" target="_blank" rel="noopener">Y aller avec Waze</a><a href="${ap}" target="_blank" rel="noopener">Y aller avec Plans</a></div>`;
  $('ov').classList.add('show');$('sheet').classList.add('show');
}
function closeSheet(){$('ov').classList.remove('show');$('sheet').classList.remove('show')}
$('ov').onclick=closeSheet;

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
