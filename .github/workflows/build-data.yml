name: Construire la base de restaurants

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les données OpenStreetMap
        run: python3 build_pois.py --refresh --no-serve
      - name: Enregistrer pois.json
        run: |
          git config user.name "croque-route-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pois.json
          git diff --cached --quiet || git commit -m "Mise à jour de la base"
          git push
